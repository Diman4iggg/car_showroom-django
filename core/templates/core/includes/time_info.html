<section class="site-time site-container" aria-labelledby="site-time-title">
    <h2 id="site-time-title">Время</h2>
    <p>Тайм зона пользователя: {{ user_timezone }}</p>
    <p>Текущая дата: {{ current_date }}</p>
    <p>Актуальное время обновления страницы: {{ current_time }}</p>
    <p>Текущая дата UTC: {{ current_date_utc }}</p>
    <p>Актуальное время обновления страницы UTC: {{ current_time_utc }}</p>
    <pre>{{ text_calendar }}</pre>
</section>
