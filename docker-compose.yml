services:
  db:
    image: postgres:17
    container_name: car_showroom_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_showroom
      POSTGRES_USER: car_showroom_user
      POSTGRES_PASSWORD: car_showroom_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_showroom_user -d car_showroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: car_showroom_web
    restart: unless-stopped
    command: sh docker/entrypoint.sh
    environment:
      DATABASE_URL: postgresql://car_showroom_user:car_showroom_password@db:5432/car_showroom
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
