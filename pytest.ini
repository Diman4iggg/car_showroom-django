[pytest]
DJANGO_SETTINGS_MODULE = CarShowroom.settings
python_files = tests.py test_*.py *_tests.py pytest_*.py
addopts = --strict-markers --cov=accounts --cov=analytics --cov=core --cov=integrations --cov=sales --cov=showroom --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=70
markers =
    unit: isolated functions and forms without database access
    integration: database or HTTP transport integration
    scenario: multiple requests exercising a business workflow
    known_defect: regression for an open issue documented in ISSUES.md
